data:
  h5_path: /home1/ppatel2025/nowcasting2/data/imerg_data_h5_clean/imerg_data.h5
  patch_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/data/IMERG
  cache_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/cache_improved_v3
  var_name: IMERG

patches:
  patch_size: 32
  image_size: 64
  stride: 1
  min_nonzeros: 5
  nonzero_threshold: 0.1

pipeline:
  input_timesteps: 16
  output_timesteps: 12
  interval_minutes: 30
  sample_shape: [2, 2]

split:
  chunk_days: 2
  valid_frac: 0.1
  test_frac: 0.1
  random_seed: 42

sampling:
  bins_low: 0.1
  bins_high: 20.0
  num_bins: 6
  batch_size: 8
  dry_bin_weight: 0.0               # uniform sampling — balanced normalization handles dry/rain naturally

transform:
  log: true
  threshold: 0.1
  fill_value: 0.01
  # Threshold-centered normalization:
  #   mean = log10(threshold) = log10(0.1) = -1.0   → rain/dry boundary at 0 sigma
  #   std  = 0.55                                    → full range [-2.0, +1.3] fits within ±4 sigma
  # Dry (-1.82σ), light rain (+1.82σ), heavy rain (+3.64σ) — all reachable by diffusion.
  mean: -1.0
  std: 0.55

model:
  embed_dim: 64
  analysis_depth: 4
  forecast_depth: 4
  cascade_depth: 4
  model_channels: 64
  channel_mult: [1, 2, 4, 4]
  attention_resolutions: [1, 2, 4]
  num_heads: 8
  num_res_blocks: 2
  lr: 5e-5
  lr_warmup: 500
  model_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/checkpoints_improved_v2
  use_groupnorm: true               # enable GroupNorm in UNet ResBlocks
  dropout: 0.1                      # dropout in UNet ResBlocks
  beta_schedule: cosine             # cosine noise schedule instead of linear
  clip_denoised: true               # clip pred_x0 during PLMS sampling
  clip_range: [-2.5, 4.5]           # matches data range: dry=-1.82σ to heavy rain=+4.2σ
