data:
  h5_path: /home1/ppatel2025/nowcasting2/data/imerg_data_h5_clean/imerg_data.h5
  patch_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/data/IMERG
  cache_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/cache_overpred
  var_name: IMERG

patches:
  patch_size: 32
  image_size: 64
  stride: 1
  min_nonzeros: 5
  nonzero_threshold: 0.1

pipeline:
  input_timesteps: 16
  output_timesteps: 12
  interval_minutes: 30
  sample_shape: [2, 2]

split:
  chunk_days: 2
  valid_frac: 0.1
  test_frac: 0.1
  random_seed: 42

sampling:
  bins_low: 0.1
  bins_high: 20.0
  num_bins: 6                       # reduced from 10 for better per-bin representation
  batch_size: 8
  dry_bin_weight: 0.20              # give dry/zero bin 35% sampling probability

transform:
  log: true
  threshold: 0.1
  fill_value: 0.01
  # UPDATE these after running:
  #   python -m nowcaster_models.ldcast.compute_normalization --config nowcaster_models/ldcast/config_improved.yaml
  mean: -1.928007
  std: 0.360285

model:
  embed_dim: 64
  analysis_depth: 4
  forecast_depth: 4
  cascade_depth: 4
  model_channels: 64
  channel_mult: [1, 2, 4, 4]
  attention_resolutions: [1, 2, 4]
  num_heads: 8
  num_res_blocks: 2
  lr: 5e-5                          # reduced from 1e-4
  lr_warmup: 500
  model_dir: /home1/ppatel2025/nowcasting2/nowcaster_models/ldcast/checkpoints_overpred
  use_groupnorm: true               # enable GroupNorm in UNet ResBlocks
  dropout: 0.1                      # dropout in UNet ResBlocks
  beta_schedule: cosine             # cosine noise schedule instead of linear
  clip_denoised: true               # clip pred_x0 during PLMS sampling
  clip_range: [-5.0, 4.0]          # clipping bounds in normalized space
